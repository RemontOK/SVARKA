<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVARKA - АльфаСмарт</title>
    <script>
      // GitHub Pages: сохраняем путь и открываем index.html (history mode)
      (function () {
        var path = window.location.pathname
        var repoPath = '/SVARKA'
        var search = window.location.search

        if (/\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|json|map|php)$/i.test(path)) {
          return
        }

        var route = path.startsWith(repoPath) ? path.slice(repoPath.length) || '/' : path
        sessionStorage.setItem('spa-redirect-path', route + search)
        window.location.replace(repoPath + '/')
      })()
    </script>
  </head>
  <body>
    <p>Загрузка…</p>
  </body>
</html>
